منظم الإيصالات والحوالات البنكية الآلي (SNB & General Receipts Organizer)
تطبيق بلغة Python متكامل لمعالجة، أرشفة، وتعديل أسماء إيصالات الحوالات والمدفوعات البنكية (مثل إيصالات البنك الأهلي السعودي SNB) آلياً، واستخراج سجل مالي شامل بجميع العمليات في ملف إكسيل (Excel) منسق.

🌟 الميزات الرئيسية
التعرف الآلي على مختلف أنواع الحوالات:

التحويلات البنكية (NCB): استخراج اسم المستفيد والمبلغ المالي المباشر.

الحوالات المحلية (Local Transfers): استخراج الأيبان والمستفيد ورسوم العملية.

المدفوعات الحكومية (MOI): التعرف على اسم الخدمة (مثل تجديد إقامة) والجهة والمستفيد.

